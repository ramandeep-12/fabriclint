[tool.fabriclint]

ignore = []

exclude = [
    ".venv/**",
    "build/**",
    "dist/**"
]

[tool.fabriclint.per-file-ignores]

"examples/broken-project/**" = [
    "FL001",
    "FL002",
    "FL003",
    "FL004",
    "FL005"
]


[tool.fabriclint.rules.FL203]
severity = "MEDIUM"
[tool.fabriclint.rules.FL204]
enabled = true
severity = "MEDIUM"